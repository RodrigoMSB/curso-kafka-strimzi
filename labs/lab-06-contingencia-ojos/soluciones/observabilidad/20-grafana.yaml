# Grafana con datasource (Prometheus) y dashboard aprovisionados automáticamente.
# El JSON del dashboard oficial de Strimzi se monta desde el ConfigMap
# 'grafana-dashboard-kafka', que crea el script 01-desplegar-observabilidad.sh
# a partir de infra/observabilidad/strimzi-kafka-dashboard.json (del tag 0.51.0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: meridiano-observabilidad
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.meridiano-observabilidad.svc:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: meridiano-observabilidad
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: strimzi
        folder: Strimzi
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: meridiano-observabilidad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            # Acceso anónimo de solo lectura (laboratorio; sin login).
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "meridiano" }
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 384Mi }
          volumeMounts:
            - { name: datasource, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasource, configMap: { name: grafana-datasource } }
        - { name: provider, configMap: { name: grafana-dashboard-provider } }
        - name: dashboards
          configMap:
            name: grafana-dashboard-kafka
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: meridiano-observabilidad
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
