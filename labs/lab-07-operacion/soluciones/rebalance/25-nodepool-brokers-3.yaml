# Pool de brokers (estado canónico, 3 réplicas). Tras vaciar el broker 4 con
# remove-brokers, se escala de vuelta a 3.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: meridiano-pagos
  labels:
    strimzi.io/cluster: pagos
spec:
  replicas: 3
  roles:
    - broker
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: false
        kraftMetadata: shared
