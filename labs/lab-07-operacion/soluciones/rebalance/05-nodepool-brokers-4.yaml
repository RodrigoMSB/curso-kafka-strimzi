# Pool de brokers escalado a 4 réplicas. El broker nuevo (id 4) nace VACÍO:
# agregar un broker no redistribuye nada por sí solo (eso lo hace el rebalance).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: meridiano-pagos
  labels:
    strimzi.io/cluster: pagos
spec:
  replicas: 4
  roles:
    - broker
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: false
        kraftMetadata: shared
