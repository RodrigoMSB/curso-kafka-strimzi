# Clúster DR recreado FIJADO en Kafka 4.1.1 (para practicar el upgrade sobre el
# DR, nunca sobre el primario). Es efímero y RF=1: recrearlo es barato y MM2 lo
# repuebla solo. metadataVersion 4.1-IV1 (acorde a 4.1.1).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dr-nodes
  namespace: meridiano-dr
  labels:
    strimzi.io/cluster: dr
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { cpu: "1", memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: dr
  namespace: meridiano-dr
spec:
  kafka:
    version: 4.1.1
    metadataVersion: 4.1-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
