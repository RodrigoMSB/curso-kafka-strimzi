# El core legado de Banco Meridiano vive en SU PROPIO namespace, separado de la
# plataforma de pagos: gobernanza (quién administra el core no administra Kafka).
apiVersion: v1
kind: Namespace
metadata:
  name: meridiano-core
---
# Credenciales del PostgreSQL del core. En un banco real vendrían de un gestor de
# secretos; aquí son de laboratorio.
apiVersion: v1
kind: Secret
metadata:
  name: core-postgres
  namespace: meridiano-core
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: meridianocore
  POSTGRES_DB: meridiano
  # Contraseña del usuario de replicación que usará Debezium (no superuser).
  DEBEZIUM_PASSWORD: cdcpass
