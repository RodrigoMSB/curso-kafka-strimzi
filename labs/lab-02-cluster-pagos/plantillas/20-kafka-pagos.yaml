# Plantilla — clúster Kafka de pagos. Trabaja sobre una COPIA.
# En la PARTE 1 se aplica tal cual (tras completar nada en este archivo).
# En la PARTE 2 completarás el bloque 'rack' (TODO D).
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: pagos
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV1
    # TODO D (PARTE 2): habilita rack awareness descomentando estas dos líneas y
    # completando la clave de topología. Pista: la etiqueta estándar de zona de
    # Kubernetes es topology.kubernetes.io/zone.
    # rack:
    #   topologyKey: # TODO
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
