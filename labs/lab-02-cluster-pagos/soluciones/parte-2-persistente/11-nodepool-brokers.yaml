# Pool de brokers — PARTE 2 (storage persistente).
# Cada broker recibe su propio PVC, que sobrevive al reinicio del pod. Con esto
# los mensajes ya no se pierden cuando un broker se reinicia.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: pagos
spec:
  replicas: 3
  roles:
    - broker
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: false
        kraftMetadata: shared
