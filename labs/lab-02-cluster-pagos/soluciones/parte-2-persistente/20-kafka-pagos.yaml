# Clúster Kafka de pagos — PARTE 2 (con rack awareness).
# Igual que la parte 1, más el bloque 'rack': el operador inyecta en cada broker
# la zona del nodo donde corre (leída de la etiqueta topology.kubernetes.io/zone)
# y Kafka reparte las réplicas de cada partición entre zonas distintas.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: pagos
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV1
    # Rack awareness: la clave de topología es la etiqueta estándar de zona.
    # Los tres workers se etiquetan con bin/01-etiquetar-zonas.sh.
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
