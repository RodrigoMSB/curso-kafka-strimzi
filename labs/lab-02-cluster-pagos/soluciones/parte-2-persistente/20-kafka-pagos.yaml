# Clúster Kafka de pagos — PARTE 2 (persistente, todavía SIN rack).
# El almacenamiento ya es persistente (vive en los KafkaNodePool de esta misma
# carpeta): el clúster sobrevive al reinicio de los pods. El rack awareness NO se
# activa aquí a propósito. Es el corazón del lab: cambiar el storage NO se puede
# en caliente (el operador ignora el cambio y avisa; hay que destruir y recrear,
# guía 04), mientras que activar rack SÍ se puede en caliente (el operador hace
# un rolling update, guía 05). Por eso los dos estados viajan separados.
# El estado final, con rack, está en soluciones/parte-3-rack/.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: pagos
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
