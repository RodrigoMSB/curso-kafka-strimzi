# Clúster Kafka de pagos ENDURECIDO (Lab 03, parte 2).
# Parte del estado del Lab 02 (persistente + rack) y añade:
#   - listener 'tls' (9093) con autenticación mTLS,
#   - listener 'scram' (9094) con autenticación SCRAM-SHA-512,
#   - authorization: simple (ACLs gestionadas vía KafkaUser).
# El listener 'plain' (9092) se conserva en este lab; su cierre formal es el
# Lab 04. Con authorization habilitada, un cliente sin autenticar (ANONYMOUS)
# queda sin permisos: la puerta vieja se cierra de facto.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: pagos
spec:
  kafka:
    version: 4.2.0
    metadataVersion: 4.2-IV1
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: scram
        port: 9094
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
