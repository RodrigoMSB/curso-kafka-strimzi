# Configuración del clúster kind para el curso de Banco Meridiano.
#
# Topología: 1 nodo control-plane + 3 nodos worker. Aunque el Lab 01 solo
# instala el operador, el curso completo necesita 3 workers para distribuir los
# brokers de Kafka y simular tres zonas de disponibilidad desde el Lab 02 (rack
# awareness). El clúster nace UNA sola vez con su topología definitiva y
# evoluciona durante todo el curso; no se recrea por lab.
#
# La imagen del nodo está FIJADA de forma explícita (pin con digest) a
# Kubernetes v1.34.8 en los cuatro nodos. Motivo: la matriz de soporte oficial
# de Strimzi 0.51 prueba Kubernetes 1.30 a 1.35. Un kind recién instalado puede
# traer una versión más nueva (la rama actual de kind ya apunta a 1.36), fuera
# de esa matriz. Fijar la versión es disciplina de plataforma: todos trabajamos
# sobre una versión probada, no sobre "la que toque ese día".
#
# El digest se copió de las release notes oficiales de kind v0.32.0:
#   https://github.com/kubernetes-sigs/kind/releases/tag/v0.32.0
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridiano
nodes:
  - role: control-plane
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
  - role: worker
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
  - role: worker
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
  - role: worker
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
